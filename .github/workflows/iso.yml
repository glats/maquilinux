# iso.yml - Bootable live ISO build and publish
#
# Triggers:
#   push: tags v*   - Build ISO + attach to GitHub Release
#   workflow_dispatch - Manual build (build-only by default)
#   workflow_call     - Called from build-rpms-v2.yml after clean build
#
# Design: openspec/changes/auto-release-iso/design.md
# Tasks:  openspec/changes/auto-release-iso/tasks.md

name: Build ISO

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: 'ISO version string (default: auto from tag or date)'
        type: string
        required: false
        default: ''
      publish:
        description: 'Publish ISO to maquiroot.glats.org after build'
        type: boolean
        required: false
        default: false
      dry_run:
        description: 'Build only, skip publish and GitHub Release'
        type: boolean
        required: false
        default: false
      caller_run_id:
        description: 'Run ID of the calling workflow (for artifact download)'
        type: string
        required: false
        default: ''

jobs:
  build-iso:
    name: Build ISO
    runs-on: [self-hosted, maquilinux]
    timeout-minutes: 120

    env:
      MQL_ROOTFS: /mnt/maquilinux

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF" ]; then
              VERSION="26.4-$(date +%Y%m%d)"
            fi
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building ISO version: $VERSION"

      - name: Load configuration
        run: |
          source mql.conf 2>/dev/null || true
          echo "MQL_ROOTFS=${MQL_ROOTFS:-/mnt/maquilinux}" >> $GITHUB_ENV

      - name: Setup chroot
        run: |
          # Verify or mount overlay
          if ! mountpoint -q "$MQL_ROOTFS/merged" 2>/dev/null; then
            echo "Mounting overlay..."
            sudo mount -t overlay overlay \
              -o lowerdir="$MQL_ROOTFS/base",upperdir="$MQL_ROOTFS/layers/upper",workdir="$MQL_ROOTFS/layers/work" \
              "$MQL_ROOTFS/merged"
          fi
          echo "Overlay mounted at $MQL_ROOTFS/merged"

          # Bind workspace into chroot at /mnt/workspace
          sudo mkdir -p "$MQL_ROOTFS/merged/mnt/workspace"
          if ! mountpoint -q "$MQL_ROOTFS/merged/mnt/workspace" 2>/dev/null; then
            sudo mount --bind "$GITHUB_WORKSPACE" "$MQL_ROOTFS/merged/mnt/workspace"
            echo "Workspace bind-mounted at /mnt/workspace"
          fi

          # Bind RPMS repo into chroot at /mnt/repo
          sudo mkdir -p "$MQL_ROOTFS/merged/mnt/repo"
          if ! mountpoint -q "$MQL_ROOTFS/merged/mnt/repo" 2>/dev/null; then
            sudo mount --bind "$GITHUB_WORKSPACE/RPMS" "$MQL_ROOTFS/merged/mnt/repo" 2>/dev/null || true
            echo "RPMS repo bind-mounted at /mnt/repo"
          fi

          # Mount proc and dev if needed
          if ! mountpoint -q "$MQL_ROOTFS/merged/proc" 2>/dev/null; then
            sudo mount -t proc proc "$MQL_ROOTFS/merged/proc" || true
          fi
          if ! mountpoint -q "$MQL_ROOTFS/merged/dev" 2>/dev/null; then
            sudo mount --bind /dev "$MQL_ROOTFS/merged/dev" || true
          fi

          echo "Chroot environment ready"

      - name: Verify ISO dependencies
        run: |
          MISSING=""
          command -v xorriso >/dev/null 2>&1 || MISSING="$MISSING xorriso"
          command -v mksquashfs >/dev/null 2>&1 || MISSING="$MISSING mksquashfs"
          command -v dracut >/dev/null 2>&1 || MISSING="$MISSING dracut"
          if [ -n "$MISSING" ]; then
            echo "ERROR: Missing ISO dependencies:$MISSING"
            echo "Install: xorriso squashfs-tools dracut"
            exit 1
          fi
          echo "All ISO dependencies present"

      - name: Download built RPMs (when triggered from CI pipeline)
        if: inputs.caller_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: rpms
          run-id: ${{ inputs.caller_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: RPMS

      - name: Verify RPMs available
        run: |
          if [ -d "RPMS/x86_64" ] && [ -n "$(ls RPMS/x86_64/*.rpm 2>/dev/null)" ]; then
            RPM_COUNT=$(ls RPMS/x86_64/*.rpm | wc -l)
            echo "RPMs available: $RPM_COUNT packages in RPMS/x86_64/"
          else
            echo "WARNING: No RPMs found in RPMS/x86_64/"
            echo "Continuing with existing chroot state..."
          fi

      - name: Release rootfs
        run: |
          echo "Installing all RPMs into chroot..."
          ./mql release rootfs

      - name: Build ISO
        run: |
          ./mql release iso
          VERSION="${{ steps.version.outputs.version }}"
          TIMESTAMP=$(date +%Y%m%d)
          if [ -f "maquilinux-${TIMESTAMP}.iso" ]; then
            mv "maquilinux-${TIMESTAMP}.iso" "maquilinux-${VERSION}.iso"
          fi
          ISO_SIZE=$(stat -c%s "maquilinux-${VERSION}.iso" 2>/dev/null || echo 0)
          if [ "$ISO_SIZE" -lt 100000000 ]; then
            echo "ERROR: ISO too small (${ISO_SIZE} bytes). Build may have failed."
            exit 1
          fi
          echo "ISO built: maquilinux-${VERSION}.iso ($(du -h maquilinux-${VERSION}.iso | cut -f1))"

      - name: Generate checksums
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd "$GITHUB_WORKSPACE"
          sha256sum "maquilinux-${VERSION}.iso" > "maquilinux-${VERSION}.iso.sha256"
          sha512sum "maquilinux-${VERSION}.iso" > "maquilinux-${VERSION}.iso.sha512"
          sha256sum "maquilinux-${VERSION}.iso"
          sha512sum "maquilinux-${VERSION}.iso"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: iso
          path: |
            maquilinux-${{ steps.version.outputs.version }}.iso
            maquilinux-${{ steps.version.outputs.version }}.iso.sha*
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
        uses: softprops/action-gh-release@v1
        with:
          files: |
            maquilinux-${{ steps.version.outputs.version }}.iso
            maquilinux-${{ steps.version.outputs.version }}.iso.sha*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-iso:
    name: Publish ISO to maquiroot
    needs: build-iso
    if: inputs.publish && !inputs.dry_run
    uses: ./.github/workflows/publish-iso.yml
    with:
      version: ${{ needs.build-iso.outputs.version }}
